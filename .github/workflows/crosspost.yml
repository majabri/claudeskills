# Instagram -> YouTube + TikTok cross-poster (skill: plugins/marketing/skills/social-crosspost)
#
# Runs every hour. While a platform still owes old reels it posts a batch every run
# (YouTube up to 6, TikTok up to 5; each stops early at the platform's daily cap).
# Once a platform is caught up it only acts at 08:30, 16:30 and 19:30 America/Detroit.
#
# Secrets (Settings -> Secrets and variables -> Actions): IG_ACCESS_TOKEN, IG_USER_ID,
# YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN, TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET,
# TIKTOK_REFRESH_TOKEN. Posting history (no secrets) lives on the `crosspost-state` branch.
name: Instagram cross-post

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run both platforms now, even outside the normal hours"
        type: boolean
        default: false

concurrency:
  group: crosspost
  cancel-in-progress: false

permissions:
  contents: write   # only to save posting history to the crosspost-state branch

jobs:
  crosspost:
    if: github.repository == 'majabri/claudeskills'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SKILL: plugins/marketing/skills/social-crosspost
      CROSSPOST_DATA_DIR: ${{ github.workspace }}/state
      CROSSPOST_PLATFORMS: youtube,tiktok
      # Only reels whose caption has this tag are cross-posted (Kings episodes only)
      CROSSPOST_REQUIRE_TAG: "#DadAndHisLittleKings"
      YT_PRIVACY: public
      YT_MADE_FOR_KIDS: "true"   # channel is set as made for kids (COPPA)
      # Used only when an Instagram reel has no caption (instead of "New video")
      YT_FALLBACK_TITLE: "Dad vs the Kings 👑 | Abou Keresh & Three Kings"
      YT_FALLBACK_DESCRIPTION: "DAD & HIS LITTLE KINGS 👑 Family comedy, 3 episodes a day. Dad vs the clock. Kings vs the plan 😂\n\nFollow the kings on Instagram: @abookrsh3kings"
      # TikTok goes through Buffer (audited TikTok partner, free plan) so posts go public.
      TIKTOK_MODE: buffer
      BUFFER_TIKTOK_CHANNEL_ID: "6b0472dc8541f09ecb794519"   # @abookrsh3kings in Buffer
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      # Optional: encrypts refreshed sign-ins (tokens.enc on the history branch)
      CROSSPOST_TOKEN_KEY: ${{ secrets.CROSSPOST_TOKEN_KEY }}
      # Read Instagram once per run (all steps share the result)
      IG_CACHE_SECONDS: "1800"
    steps:
      - uses: actions/checkout@v4

      - name: Load posting history
        run: |
          mkdir -p state
          if git fetch --depth 1 origin crosspost-state 2>/dev/null; then
            git show origin/crosspost-state:state.json > state/state.json
            git show origin/crosspost-state:tokens.enc > state/tokens.enc 2>/dev/null || rm -f state/tokens.enc
          fi
          if [ ! -s state/state.json ]; then
            echo "::error::No posting history on the crosspost-state branch. Refusing to run, so nothing is posted twice."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r "$SKILL/requirements.txt"

      - name: Check TikTok posts handed to Buffer
        # Marks posts that went live; puts rejected ones back in line. A TikTok spam flag
        # pauses TikTok until someone runs: crosspost.py cooldown --clear tiktok
        run: python3 "$SKILL/scripts/crosspost.py" verify | tee verify.json || true

      - name: Decide what runs this hour
        id: plan
        run: |
          hour=$(TZ=America/Detroit date +%H)
          force="${{ inputs.force }}"
          # 1) Platforms resting after a limit are skipped without calling any API.
          python3 "$SKILL/scripts/crosspost.py" cooldown > cooldown.json; cat cooldown.json
          rest() { python3 -c "import json;print(str(json.load(open('cooldown.json'))['$1']['resting']).lower())"; }
          if [ "$force" != "true" ] && [ "$(python3 -c "import json;print(json.load(open('cooldown.json'))['all_resting'])")" = "True" ]; then
            echo "Both platforms are resting after hitting their limits; not reading Instagram this hour."
            echo "youtube=false" >> "$GITHUB_OUTPUT"; echo "tiktok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2) One Instagram read (cached for the steps below).
          if ! python3 "$SKILL/scripts/crosspost.py" backlog > backlog.json; then
            echo "::error::Could not check Instagram/backlog: $(cat backlog.json)"
            exit 1
          fi
          cat backlog.json
          for p in youtube tiktok; do
            old=$(python3 -c "import json;print(json.load(open('backlog.json'))['platforms']['$p']['owed_backlog'])")
            go=false
            if [ "$force" = "true" ]; then go=true                          # manual run
            elif [ "$(rest $p)" = "true" ]; then go=false                   # at its limit: rest
            elif [ "$p" = tiktok ] && [ "$old" -gt 0 ]; then                # TikTok backlog: 4 a day (8:30, 12:30, 4:30, 8:30)
              case "$hour" in 08|12|16|20) go=true ;; esac                    # (slow and steady, so TikTok does not see spam)
            elif [ "$old" -gt 0 ]; then go=true                             # backlog left: every hour
            else case "$hour" in 08|16|19) go=true ;; esac                  # caught up: 8:30, 4:30, 7:30
            fi
            echo "$p backlog $old, resting $(rest $p), local hour $hour -> run=$go"
            echo "$p=$go" >> "$GITHUB_OUTPUT"
          done

      - name: YouTube
        if: steps.plan.outputs.youtube == 'true'
        run: python3 "$SKILL/scripts/crosspost.py" run --platforms youtube --limit 6 --publish --cleanup | tee youtube.json

      - name: TikTok
        if: steps.plan.outputs.tiktok == 'true'
        run: python3 "$SKILL/scripts/crosspost.py" run --platforms tiktok --limit 1 --publish --cleanup | tee tiktok.json

      - name: Save posting history
        if: always()
        run: |
          [ -s state/state.json ] || exit 0
          git config user.name "crosspost-bot"
          git config user.email "crosspost-bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp state/state.json "$tmp/state.json"
          [ -s state/tokens.enc ] && cp state/tokens.enc "$tmp/tokens.enc"   # encrypted; never tokens.json
          git fetch --depth 1 origin crosspost-state
          git checkout -q -B crosspost-state origin/crosspost-state
          cp "$tmp/state.json" state.json
          git add state.json
          if [ -s "$tmp/tokens.enc" ]; then cp "$tmp/tokens.enc" tokens.enc; git add tokens.enc; fi
          git diff --cached --quiet || git commit -q -m "Update cross-post history"
          git push -q origin crosspost-state

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cross-post run"
            for f in verify cooldown backlog youtube tiktok; do
              if [ -s "$f.json" ]; then echo "**$f**"; echo '```json'; cat "$f.json"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
